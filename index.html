<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Foodvisor</title>
  <meta name="description" content="Diário alimentar personalizado: calorias, macros, água e peso.">
  <meta name="theme-color" content="#18b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Foodvisor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Questionário inicial -->
  <div id="onboarding" class="onboarding" hidden>
    <div class="ob-top">
      <button id="obBack" class="icon-btn" type="button" aria-label="Voltar">‹</button>
      <div class="ob-progress"><div id="obBar"></div></div>
    </div>
    <div id="obEta" class="ob-eta" hidden></div>
    <div id="obStep" class="ob-step"></div>
    <div class="ob-footer"><button id="obNext" class="btn btn-primary" type="button">Continuar</button></div>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <main>
      <section id="view-diario" class="view"></section>
      <section id="view-progresso" class="view" hidden></section>
      <section id="view-exames" class="view" hidden></section>
      <section id="view-plano" class="view" hidden></section>
      <section id="view-perfil" class="view" hidden></section>
    </main>
    <nav class="tabbar" aria-label="Navegação">
      <button type="button" data-tab="diario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7h6M9 10.5h4"/></svg>
        <span>Diário</span>
      </button>
      <button type="button" data-tab="progresso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16v-4M11 16V8M16 16v-6M20 16V5"/></svg>
        <span>Progresso</span>
      </button>
      <button type="button" data-tab="exames">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4M8 13h2l1.5-3 2 6 1.5-3H16"/></svg>
        <span>Exames</span>
      </button>
      <button type="button" data-tab="plano">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c0-9 6-15 15-15 0 9-6 15-15 15z"/><path d="M5 20l8-8"/></svg>
        <span>Plano</span>
      </button>
      <button type="button" data-tab="perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Buscar e adicionar alimento -->
  <dialog id="addSheet" class="sheet" aria-labelledby="addTitle">
    <div class="sheet-body">
      <div class="sheet-head">
        <div><h2 id="addTitle">Adicionar alimento</h2><small id="addDay" class="muted"></small></div>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <div id="mealChips" class="chips"></div>
      <input id="search" class="search" type="search" placeholder="Buscar alimento (ex.: arroz, ovo, banana)" autocomplete="off">
      <div id="results" class="results"></div>
      <button id="customBtn" type="button" class="btn btn-ghost">+ Criar alimento (fica salvo em "Meus alimentos")</button>
    </div>
  </dialog>

  <!-- Quantidade -->
  <dialog id="qtySheet" class="sheet" aria-labelledby="qtyName">
    <div class="sheet-body">
      <div class="sheet-head">
        <div><h2 id="qtyName"></h2><small id="qtyPortion" class="muted"></small></div>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <p id="qtyWarn" class="note" hidden></p>
      <div class="qty">
        <button id="qtyMinus" type="button" class="icon-btn" aria-label="Menos">−</button>
        <input id="qtyInput" type="text" inputmode="decimal" aria-label="Quantidade de porções">
        <button id="qtyPlus" type="button" class="icon-btn" aria-label="Mais">+</button>
      </div>
      <p class="muted center">porções</p>
      <div id="qtyChips" class="chips center">
        <button type="button" class="chip" data-q="0.5">½</button>
        <button type="button" class="chip" data-q="1">1</button>
        <button type="button" class="chip" data-q="1.5">1½</button>
        <button type="button" class="chip" data-q="2">2</button>
        <button type="button" class="chip" data-q="3">3</button>
      </div>
      <div id="qtyMacros" class="stats four"></div>
      <button id="qtyAdd" type="button" class="btn btn-primary">Adicionar</button>
    </div>
  </dialog>

  <!-- Alimento manual -->
  <dialog id="customSheet" class="sheet" aria-labelledby="customTitle">
    <form id="customForm" class="sheet-body">
      <div class="sheet-head">
        <h2 id="customTitle">Criar alimento</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <label class="field">Nome<input name="name" required autocomplete="off"></label>
      <label class="field">Porção<input name="portion" placeholder="ex.: 1 prato (300 g)" autocomplete="off"></label>
      <div class="grid2">
        <label class="field">Calorias (kcal)<input name="kcal" inputmode="decimal" required></label>
        <label class="field">Proteínas (g)<input name="p" inputmode="decimal"></label>
        <label class="field">Carboidratos (g)<input name="c" inputmode="decimal"></label>
        <label class="field">Gorduras (g)<input name="f" inputmode="decimal"></label>
      </div>
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>
  </dialog>

  <!-- Novo exame de bioimpedância -->
  <dialog id="examSheet" class="sheet" aria-labelledby="examTitle">
    <form id="examForm" class="sheet-body scroll">
      <div class="sheet-head">
        <h2 id="examTitle">Nova bioimpedância</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <label class="photo-pick">
        <input id="examPhoto" type="file" accept="image/*" hidden>
        <span id="examPhotoLabel">📷 Anexar foto do resultado</span>
      </label>
      <img id="examPreview" class="exam-photo" alt="Foto anexada (toque para ampliar)" hidden>
      <p class="muted">Com a foto ao lado, digite os valores impressos. Só a data é obrigatória: deixe em branco o que o seu exame não mostrar.</p>
      <label class="field">Data do exame<input name="date" type="date" required></label>
      <div id="examFields" class="grid2"></div>
      <label class="field">Local ou aparelho<input name="local" placeholder="ex.: InBody 270 na academia" autocomplete="off"></label>
      <label class="field">Observações<textarea name="notes" rows="2"></textarea></label>
      <button type="submit" class="btn btn-primary">Salvar exame</button>
    </form>
  </dialog>

  <!-- Detalhes do exame -->
  <dialog id="examView" class="sheet" aria-label="Detalhes do exame">
    <div id="examViewBody" class="sheet-body scroll"></div>
  </dialog>

  <!-- Foto em tela cheia -->
  <dialog id="viewer" class="viewer" aria-label="Foto do exame">
    <button type="button" class="icon-btn viewer-close" data-close aria-label="Fechar">✕</button>
    <div class="viewer-scroll"><img id="viewerImg" alt="Foto do exame"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
